<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Título, description, OG, Twitter y datos estructurados: se inyectan en build desde
         site.ts (src/render/head.ts). Escritas a mano aquí duplicaban el copy y §5 pide una
         sola fuente de texto. -->
    <!--@head-->
    <!--@build-->

    <!--
      Captura de errores para el panel de `?diag`. Va EN LÍNEA y antes del módulo a propósito:
      un fallo al cargar o evaluar `main.ts` no lo vería un manejador instalado desde dentro de
      `main.ts`, y ese es justo el caso que hay que poder ver en un teléfono sin depurador.
    -->
    <script>
      (function () {
        var lista = [];
        window.__errores = lista;
        var apunta = function (origen, texto) {
          if (lista.length < 40) lista.push(origen + ': ' + texto);
        };
        window.addEventListener('error', function (e) {
          apunta('error', e.message + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          apunta('promesa', String((e.reason && e.reason.message) || e.reason));
        });
        var orig = console.error;
        console.error = function () {
          apunta('console', Array.prototype.join.call(arguments, ' '));
          orig.apply(console, arguments);
        };
      })();
    </script>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Fuentes críticas: el hero usa la sans y la mono desde el primer frame -->
    <link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-400.woff2" as="font" type="font/woff2" crossorigin />

    <!--
      El overlay se sirve ya visible en el HTML para que cubra la pantalla desde el primer
      paint: si esperara al módulo, se veían ~900 ms de blanco antes del acento (medido en
      scripts/check-preloader.ts). Este script bloqueante es la única forma de saltárselo en
      las visitas siguientes sin que asome el destello de acento, porque el CSS no puede leer
      sessionStorage. Es diminuto y va en línea a propósito.
    -->
    <script>
      try {
        if (sessionStorage.getItem('javier:preloaded') === '1') {
          document.documentElement.dataset.preloaded = 'true';
        }
      } catch (e) {
        /* modo privado o cookies bloqueadas: se muestra el preloader, que no rompe nada */
      }
    </script>

    <script type="module" src="/src/main.ts"></script>
  </head>

  <body>
    <a class="skip-link t-mono" href="#main">Skip to content</a>
    <!--@site-->
  </body>
</html>
