<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141314" />

    <title>Javier — Mechatronics Engineer &amp; AI Developer</title>
    <meta
      name="description"
      content="Mechatronics engineer building AI products. Portfolio built with Claude Code."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Javier — Mechatronics Engineer &amp; AI Developer" />
    <meta
      property="og:description"
      content="Mechatronics engineer building AI products. Portfolio built with Claude Code."
    />
    <meta property="og:image" content="/img/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Fuentes críticas: el hero usa la sans y la mono desde el primer frame -->
    <link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-400.woff2" as="font" type="font/woff2" crossorigin />

    <!--
      El overlay se sirve ya visible en el HTML para que cubra la pantalla desde el primer
      paint: si esperara al módulo, se veían ~900 ms de blanco antes del acento (medido en
      scripts/check-preloader.ts). Este script bloqueante es la única forma de saltárselo en
      las visitas siguientes sin que asome el destello de acento, porque el CSS no puede leer
      sessionStorage. Es diminuto y va en línea a propósito.
    -->
    <script>
      try {
        if (sessionStorage.getItem('javier:preloaded') === '1') {
          document.documentElement.dataset.preloaded = 'true';
        }
      } catch (e) {
        /* modo privado o cookies bloqueadas: se muestra el preloader, que no rompe nada */
      }
    </script>

    <script type="module" src="/src/main.ts"></script>
  </head>

  <body>
    <a class="skip-link t-mono" href="#main">Skip to content</a>
    <!--@site-->
  </body>
</html>
